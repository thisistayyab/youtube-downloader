# Render Blueprint — https://render.com/docs/blueprint-spec
# Create a Blueprint in the Render dashboard and point it at this repository.
services:
  - type: web
    name: youtube-downloader
    runtime: node
    plan: standard # 1 GB / 1 CPU — required for 4K transcoding; starter works for 1080p
    region: oregon # change to your closest region: oregon | ohio | virginia | frankfurt | singapore
    buildCommand: npm ci && npm run setup:binaries -- --with-ffmpeg && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    numInstances: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: HOSTNAME
        value: "0.0.0.0"
      # Ephemeral RAM-backed temp dir: files are only a pass-through buffer,
      # cleaned up immediately after the HTTP response stream closes.
      - key: DOWNLOAD_DIR
        value: /tmp/youtube-downloader
      # Hard safety TTL for jobs/files that are never delivered (default 15 min).
      - key: JOB_TTL_MS
        value: "900000"
      # Grace window after a successful delivery before cleanup (default 15 s).
      # Kept short so nothing lingers on the server.
      - key: DELIVERED_JOB_TTL_MS
        value: "15000"
      # Max idle time during an ffmpeg merge before retry (default 5 min).
      - key: PROCESSING_TIMEOUT_MS
        value: "300000"
      # Parallel yt-dlp/ffmpeg jobs allowed on the instance. Lower = faster each.
      - key: MAX_CONCURRENT_JOBS
        value: "2"
      # Per-IP rate limits to protect the instance.
      - key: RATE_LIMIT_INFO_PER_MIN
        value: "20"
      - key: RATE_LIMIT_DOWNLOAD_PER_MIN
        value: "6"
